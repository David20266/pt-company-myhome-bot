name: Check MyHome listings

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apartment-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble

    steps:
      - name: Download project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Python package
        run: python -m pip install --no-cache-dir -r requirements-cloud.txt

      - name: Check listings and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_once.py

      - name: Save monitoring state
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes to save"
            exit 0
          fi

          git commit -m "Update apartment monitoring state"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
