name: Check MyHome listings

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apartment-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble

    steps:
      - name: Download project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Python package
        run: python -m pip install --no-cache-dir -r requirements-cloud.txt

      - name: Check listings and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_resilient.py

      - name: Save monitoring state
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          set -e

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp state.json /tmp/apartment-state.json

          for attempt in 1 2 3; do
            echo "State save attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/apartment-state.json state.json
            git add state.json

            if git diff --cached --quiet; then
              echo "No state changes to save"
              exit 0
            fi

            git commit -m "Update apartment monitoring state"

            if git push origin HEAD:main; then
              echo "Monitoring state saved successfully"
              exit 0
            fi

            echo "Push changed remotely; retrying with latest main"
            sleep 5
          done

          echo "Failed to save monitoring state after 3 attempts"
          exit 1
